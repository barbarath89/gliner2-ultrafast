[project]
name = "gliner2-ultrafast"
version = "0.1.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "gliner2[local]>=2.0",
    "httpx[http2]>=0.28,<1",
    # 4.47 reads a checkpoint's `extra_special_tokens` as a mapping. The GLiNER2.5
    # checkpoints store a list, so their tokenizer fails to load from 4.47 on.
    "transformers>=4.45,<4.47",
]

[project.scripts]
gliner = "gliner_ultrafast.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["gliner_ultrafast"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
